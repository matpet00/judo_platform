# Render Blueprint — https://render.com/docs/blueprint-spec
# Po push na GitHub: Dashboard → New → Blueprint → vyber repo.

services:
  - type: web
    name: judo-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: bash deploy/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./judo.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_PEPPER
        generateValue: true
      - key: ENABLE_API_DOCS
        value: "false"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          name: judo-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: judo-web
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: judo-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
